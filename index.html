<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#050508">
    <title>Отзывы фриско</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a8;
            --accent-blue: #0098EA;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-cyan: #22d3ee;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-highlight: rgba(255, 255, 255, 0.22);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.35);
            --shadow-glow: 0 0 30px rgba(0, 152, 234, 0.18);
            --gradient-brand: linear-gradient(135deg, #0098EA 0%, #a855f7 50%, #ec4899 100%);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --header-h: 64px;
            --container-max: 720px;
            --touch-min: 44px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Lava lamp bubbles ── */
        .lava-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: radial-gradient(ellipse 80% 60% at 50% 100%, #0a1628 0%, #050508 55%, #000 100%);
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            bottom: -15vh;
            opacity: 0;
            animation: floatUp linear infinite;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            box-shadow:
                inset 0 0 20px rgba(255,255,255,0.12),
                inset -8px -8px 24px rgba(255,255,255,0.04),
                0 8px 32px rgba(0,0,0,0.25),
                0 0 40px var(--bubble-glow, rgba(0,152,234,0.15));
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 12%;
            left: 18%;
            width: 28%;
            height: 18%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%);
            filter: blur(1px);
        }

        .bubble::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--bubble-inner, rgba(255,255,255,0.18)) 0%, transparent 55%);
        }

        .bubble:nth-child(1)  { --bubble-glow: rgba(0,152,234,0.2);  --bubble-inner: rgba(0,152,234,0.25);  width: clamp(60px, 14vw, 110px);  height: clamp(60px, 14vw, 110px);  left: 8%;   animation-duration: 22s; animation-delay: 0s;   }
        .bubble:nth-child(2)  { --bubble-glow: rgba(168,85,247,0.2); --bubble-inner: rgba(168,85,247,0.22); width: clamp(90px, 20vw, 160px);  height: clamp(90px, 20vw, 160px);  left: 72%;  animation-duration: 28s; animation-delay: -4s;  }
        .bubble:nth-child(3)  { --bubble-glow: rgba(236,72,153,0.18);--bubble-inner: rgba(236,72,153,0.2); width: clamp(45px, 10vw, 80px);   height: clamp(45px, 10vw, 80px);   left: 42%;  animation-duration: 18s; animation-delay: -8s;  }
        .bubble:nth-child(4)  { --bubble-glow: rgba(34,211,238,0.18);--bubble-inner: rgba(34,211,238,0.2); width: clamp(70px, 16vw, 130px);  height: clamp(70px, 16vw, 130px);  left: 22%;  animation-duration: 25s; animation-delay: -12s; }
        .bubble:nth-child(5)  { --bubble-glow: rgba(0,152,234,0.15); --bubble-inner: rgba(99,179,237,0.18);width: clamp(110px, 24vw, 200px); height: clamp(110px, 24vw, 200px); left: 55%;  animation-duration: 32s; animation-delay: -2s;  }
        .bubble:nth-child(6)  { --bubble-glow: rgba(168,85,247,0.15);--bubble-inner: rgba(192,132,252,0.18);width: clamp(50px, 11vw, 90px);   height: clamp(50px, 11vw, 90px);   left: 88%;  animation-duration: 20s; animation-delay: -16s; }
        .bubble:nth-child(7)  { --bubble-glow: rgba(236,72,153,0.15);--bubble-inner: rgba(244,114,182,0.18);width: clamp(80px, 18vw, 140px);  height: clamp(80px, 18vw, 140px);  left: 3%;   animation-duration: 26s; animation-delay: -6s;  }
        .bubble:nth-child(8)  { --bubble-glow: rgba(34,211,238,0.12);--bubble-inner: rgba(103,232,249,0.15);width: clamp(55px, 12vw, 100px);  height: clamp(55px, 12vw, 100px);  left: 65%;  animation-duration: 19s; animation-delay: -10s; }

        @keyframes floatUp {
            0%   { transform: translateY(0) translateX(0) scale(0.85); opacity: 0; }
            8%   { opacity: 0.75; }
            50%  { transform: translateY(-55vh) translateX(20px) scale(1.05); opacity: 0.9; }
            85%  { opacity: 0.5; }
            100% { transform: translateY(-120vh) translateX(-15px) scale(0.95); opacity: 0; }
        }

        /* ── Layout ── */
        .app {
            position: relative;
            z-index: 1;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: var(--container-max);
            margin: 0 auto;
            padding: calc(var(--safe-top) + 12px) clamp(14px, 4vw, 28px) calc(var(--safe-bottom) + 32px);
            flex: 1;
        }

        /* ── Header ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: var(--header-h);
            padding: 10px clamp(14px, 4vw, 28px);
            padding-top: calc(var(--safe-top) + 10px);
            margin: calc(-1 * (var(--safe-top) + 12px)) calc(-1 * clamp(14px, 4vw, 28px)) 20px;
            background: rgba(5, 5, 8, 0.72);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-icon {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }

        .brand-icon img { width: 100%; height: 100%; object-fit: cover; }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* ── Buttons (touch-friendly) ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: var(--touch-min);
            min-width: var(--touch-min);
            padding: 10px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: transform 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
            position: relative;
            z-index: 2;
        }

        .btn svg { width: 18px; height: 18px; flex-shrink: 0; pointer-events: none; }

        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        .btn:active, .btn.pressed {
            transform: scale(0.96);
            background: rgba(255,255,255,0.14);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0,152,234,0.35), rgba(168,85,247,0.25));
            border-color: rgba(0,152,234,0.4);
            box-shadow: var(--shadow-glow);
        }

        .btn-icon-only { padding: 10px; width: var(--touch-min); }

        .btn:disabled {
            opacity: 0.45;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* ── Hero ── */
        .hero {
            text-align: center;
            margin-bottom: clamp(20px, 5vw, 32px);
            animation: fadeIn 0.5s ease-out;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 99px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .hero-badge svg { width: 14px; height: 14px; color: var(--accent-gold, #F7B731); }

        .hero-title {
            font-size: clamp(22px, 6vw, 32px);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .hero-sub {
            font-size: clamp(13px, 3.5vw, 16px);
            color: var(--text-secondary);
            line-height: 1.55;
            max-width: 420px;
            margin: 0 auto;
        }

        /* ── Stats ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(10px, 3vw, 16px);
            margin-bottom: clamp(18px, 4vw, 28px);
            animation: slideUp 0.5s ease-out 0.08s both;
        }

        @media (min-width: 480px) {
            .stats-row { grid-template-columns: repeat(3, 1fr); }
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: clamp(14px, 3vw, 18px);
            padding: clamp(14px, 3vw, 18px);
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-soft);
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            margin: 0 auto 8px;
            border-radius: 10px;
            background: rgba(0,152,234,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon svg { width: 18px; height: 18px; color: var(--accent-blue); }

        .stat-value {
            font-size: clamp(22px, 5vw, 28px);
            font-weight: 800;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* ── Filters ── */
        .filter-scroll {
            margin-bottom: clamp(16px, 4vw, 22px);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 2px 0 6px;
        }

        .filter-scroll::-webkit-scrollbar { display: none; }

        .filter-tabs {
            display: flex;
            gap: 8px;
            min-width: min-content;
        }

        .filter-tab {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: var(--touch-min);
            padding: 0 16px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-secondary);
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s;
            position: relative;
            z-index: 2;
        }

        .filter-tab svg { width: 14px; height: 14px; pointer-events: none; }

        .filter-tab.active {
            background: linear-gradient(135deg, rgba(0,152,234,0.22), rgba(168,85,247,0.15));
            border-color: rgba(0,152,234,0.45);
            color: #fff;
            box-shadow: 0 0 20px rgba(0,152,234,0.15);
        }

        .filter-tab:active { transform: scale(0.96); }

        /* ── Review cards ── */
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2.5vw, 14px);
        }

        .review-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: clamp(16px, 3vw, 20px);
            padding: clamp(16px, 3.5vw, 20px);
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
            animation: fadeIn 0.4s ease-out both;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: var(--shadow-soft);
            position: relative;
            z-index: 2;
        }

        .review-card:hover {
            border-color: rgba(0,152,234,0.35);
            box-shadow: var(--shadow-glow);
        }

        .review-card:active { transform: scale(0.985); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .review-user-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .user-avatar {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0,152,234,0.3), rgba(168,85,247,0.25));
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-avatar svg { width: 18px; height: 18px; opacity: 0.9; }

        .review-user {
            font-size: clamp(14px, 3.5vw, 15px);
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .review-date {
            flex-shrink: 0;
            font-size: 11px;
            color: #666;
            white-space: nowrap;
        }

        .star-row {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-bottom: 10px;
        }

        .star-row svg {
            width: 16px;
            height: 16px;
        }

        .star-row .star-empty { opacity: 0.25; }

        .review-text {
            font-size: clamp(13px, 3.2vw, 15px);
            color: rgba(255,255,255,0.88);
            line-height: 1.65;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .review-card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-blue);
            pointer-events: none;
        }

        .read-more svg { width: 14px; height: 14px; }

        /* ── Detail view ── */
        .detail-view {
            display: none;
            animation: fadeIn 0.35s ease-out;
        }

        .detail-view.active { display: block; }

        .list-view.hidden { display: none; }

        .detail-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .detail-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            border-radius: clamp(18px, 4vw, 24px);
            padding: clamp(20px, 5vw, 28px);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-soft);
        }

        .detail-stars {
            display: flex;
            gap: 4px;
            margin: 16px 0;
        }

        .detail-stars svg { width: 22px; height: 22px; }

        .detail-text {
            font-size: clamp(15px, 3.8vw, 17px);
            line-height: 1.75;
            color: rgba(255,255,255,0.92);
            word-break: break-word;
        }

        /* ── Empty & loader ── */
        .empty-state {
            text-align: center;
            padding: clamp(40px, 10vw, 72px) clamp(16px, 4vw, 24px);
            animation: fadeIn 0.5s ease-out;
        }

        .empty-icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2.5s ease-in-out infinite;
        }

        .empty-icon-wrap svg { width: 36px; height: 36px; color: var(--accent-blue); }

        .empty-title {
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: clamp(13px, 3.2vw, 15px);
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 20px;
        }

        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: clamp(48px, 12vw, 80px);
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255,255,255,0.08);
            border-left-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        .loader-text { font-size: 13px; color: var(--text-secondary); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 24px);
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            z-index: 9999;
            padding: 12px 20px;
            border-radius: 14px;
            background: rgba(20,20,28,0.92);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
            max-width: calc(100vw - 32px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ── Animations ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes pulse {
            0%, 100% { transform: scale(0.96); opacity: 0.7; }
            50% { transform: scale(1.04); opacity: 1; }
        }

        /* ── Large screens ── */
        @media (min-width: 900px) {
            :root { --container-max: 860px; }
            .reviews-list {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        @media (min-width: 1200px) {
            :root { --container-max: 1000px; }
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            .bubble { animation: none; opacity: 0.3; }
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* ── Landscape phones ── */
        @media (max-height: 500px) and (orientation: landscape) {
            .hero { margin-bottom: 14px; }
            .hero-sub { display: none; }
            .stats-row { margin-bottom: 14px; }
        }
    </style>
</head>
<body>
    <!-- Lava lamp background -->
    <div class="lava-bg" aria-hidden="true">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="app">
        <header class="header">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <img src="https://i.postimg.cc/0jwm2jkk/photo-2026-08-06-11-50-26.jpg" alt="Фриско">
                </div>
                <div class="brand-text">
                    <div class="brand-title">Отзывы фриско</div>
                    <div class="brand-sub">честные мнения покупателей</div>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" class="btn btn-icon-only" id="btn-refresh" title="Обновить" aria-label="Обновить отзывы">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                        <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="container">
            <div id="list-view" class="list-view">
                <section class="hero">
                    <div class="hero-badge">
                        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        Рейтинг магазина
                    </div>
                    <h1 class="hero-title">Отзывы фриско</h1>
                    <p class="hero-sub">Реальные отзывы от наших покупателей — выбирайте с уверенностью</p>
                </section>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        </div>
                        <div class="stat-value" id="stat-count">—</div>
                        <div class="stat-label">Отзывов</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        </div>
                        <div class="stat-value" id="stat-avg">—</div>
                        <div class="stat-label">Средняя</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                        </div>
                        <div class="stat-value" id="stat-best">—</div>
                        <div class="stat-label">Лучших ★5</div>
                    </div>
                </div>

                <div class="filter-scroll">
                    <div class="filter-tabs" role="tablist" aria-label="Фильтр по оценке">
                        <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            Все
                        </button>
                        <button type="button" class="filter-tab" data-filter="5" role="tab" aria-selected="false">
                            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            5
                        </button>
                        <button type="button" class="filter-tab" data-filter="4" role="tab" aria-selected="false">4</button>
                        <button type="button" class="filter-tab" data-filter="3" role="tab" aria-selected="false">3</button>
                        <button type="button" class="filter-tab" data-filter="2" role="tab" aria-selected="false">2</button>
                        <button type="button" class="filter-tab" data-filter="1" role="tab" aria-selected="false">1</button>
                    </div>
                </div>

                <div id="loader" class="loader-wrap">
                    <div class="spinner" role="status" aria-label="Загрузка"></div>
                    <div class="loader-text">Загружаем отзывы...</div>
                </div>

                <div id="reviews-list" class="reviews-list" role="list"></div>

                <div id="empty-state" class="empty-state" style="display:none;">
                    <div class="empty-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            <line x1="9" y1="10" x2="15" y2="10"/>
                            <line x1="9" y1="14" x2="13" y2="14"/>
                        </svg>
                    </div>
                    <div class="empty-title">Пока нет отзывов</div>
                    <div class="empty-sub">Будьте первым — оставьте отзыв через Telegram-бота</div>
                    <button type="button" class="btn btn-primary" id="btn-retry">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/></svg>
                        Обновить
                    </button>
                </div>
            </div>

            <div id="detail-view" class="detail-view" role="region" aria-label="Детали отзыва">
                <div class="detail-toolbar">
                    <button type="button" class="btn" id="btn-back" aria-label="Назад к списку">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                        Назад
                    </button>
                    <button type="button" class="btn btn-primary" id="btn-share" aria-label="Поделиться">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        Поделиться
                    </button>
                    <button type="button" class="btn" id="btn-copy" aria-label="Копировать ссылку">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Копировать
                    </button>
                </div>
                <article class="detail-card" id="detail-content"></article>
            </div>
        </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script>
        const tg = window.Telegram?.WebApp || {};
        try { tg.ready?.(); tg.expand?.(); } catch(e) {}

        let allReviews = [];
        let currentFilter = 'all';
        let currentReview = null;

        const ICON_STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
        const ICON_STAR_EMPTY = '<svg class="star-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
        const ICON_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
        const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>';

        const supabase = window.supabase.createClient(
            window.SUPABASE_URL,
            window.SUPABASE_ANON_KEY
        );

        function haptic(type) {
            try {
                if (type === 'success') tg.HapticFeedback?.notificationOccurred('success');
                else if (type === 'light') tg.HapticFeedback?.impactOccurred('light');
                else tg.HapticFeedback?.selectionChanged();
            } catch(e) {}
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        function bindPress(el) {
            if (!el) return;
            const press = () => { el.classList.add('pressed'); haptic('light'); };
            const release = () => el.classList.remove('pressed');
            el.addEventListener('touchstart', press, { passive: true });
            el.addEventListener('touchend', release);
            el.addEventListener('touchcancel', release);
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        }

        function renderStars(n, size) {
            let html = '';
            for (let i = 1; i <= 5; i++) {
                html += i <= n ? ICON_STAR : ICON_STAR_EMPTY;
            }
            return `<div class="star-row${size === 'lg' ? ' detail-stars' : ''}">${html}</div>`;
        }

        function formatDate(iso) {
            return new Date(iso).toLocaleDateString('ru-RU', {
                day: 'numeric', month: 'long', year: 'numeric'
            });
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function updateStats(reviews) {
            document.getElementById('stat-count').textContent = reviews.length;
            const best = reviews.filter(r => r.rating === 5).length;
            document.getElementById('stat-best').textContent = best;
            if (!reviews.length) {
                document.getElementById('stat-avg').textContent = '—';
                return;
            }
            const avg = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
            document.getElementById('stat-avg').textContent = avg.toFixed(1);
        }

        function renderReviews(reviews) {
            const list = document.getElementById('reviews-list');
            const empty = document.getElementById('empty-state');
            list.innerHTML = '';

            if (!reviews.length) {
                empty.style.display = 'block';
                list.style.display = 'none';
                return;
            }
            empty.style.display = 'none';
            list.style.display = '';

            reviews.forEach((r, i) => {
                const card = document.createElement('article');
                card.className = 'review-card';
                card.setAttribute('role', 'listitem');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `Отзыв от ${r.display_name}, ${r.rating} звёзд`);
                card.style.animationDelay = `${Math.min(i * 0.04, 0.4)}s`;
                card.innerHTML = `
                    <div class="review-header">
                        <div class="review-user-wrap">
                            <div class="user-avatar" aria-hidden="true">${ICON_USER}</div>
                            <div class="review-user">${escapeHtml(r.display_name)}</div>
                        </div>
                        <div class="review-date">${formatDate(r.created_at)}</div>
                    </div>
                    ${renderStars(r.rating)}
                    <div class="review-text">${escapeHtml(r.text)}</div>
                    <div class="review-card-footer">
                        <span class="read-more">Читать полностью ${ICON_ARROW}</span>
                    </div>
                `;

                const open = () => showDetail(r);
                card.addEventListener('click', open);
                card.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
                });
                list.appendChild(card);
            });
        }

        function showDetail(r) {
            currentReview = r;
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('detail-view').classList.add('active');
            document.getElementById('detail-content').innerHTML = `
                <div class="review-user-wrap">
                    <div class="user-avatar" style="width:44px;height:44px;border-radius:14px;">${ICON_USER}</div>
                    <div>
                        <div class="review-user" style="font-size:18px;white-space:normal;">${escapeHtml(r.display_name)}</div>
                        <div class="review-date" style="margin-top:4px;">${formatDate(r.created_at)}</div>
                    </div>
                </div>
                ${renderStars(r.rating, 'lg')}
                <div class="detail-text">${escapeHtml(r.text)}</div>
            `;
            history.replaceState({ view: 'detail', id: r.id }, '', `?id=${r.id}`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            haptic('light');
        }

        function showList() {
            currentReview = null;
            document.getElementById('list-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.remove('active');
            history.replaceState({ view: 'list' }, '', window.location.pathname);
            haptic('light');
        }

        function filterReviews(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => {
                const active = t.dataset.filter === filter;
                t.classList.toggle('active', active);
                t.setAttribute('aria-selected', active ? 'true' : 'false');
            });
            const filtered = filter === 'all'
                ? allReviews
                : allReviews.filter(r => r.rating === parseInt(filter, 10));
            renderReviews(filtered);
            haptic('light');
        }

        function getShareUrl(id) {
            const url = new URL(window.location.href);
            url.searchParams.set('id', id);
            return url.toString();
        }

        async function shareReview() {
            if (!currentReview) return;
            const url = getShareUrl(currentReview.id);
            const text = `Отзыв фриско — ${currentReview.display_name}: ${currentReview.text.slice(0, 80)}...`;
            try {
                if (navigator.share) {
                    await navigator.share({ title: 'Отзывы фриско', text, url });
                    haptic('success');
                    return;
                }
            } catch(e) { if (e.name === 'AbortError') return; }
            await copyToClipboard(url);
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('Ссылка скопирована!');
                haptic('success');
            } catch(e) {
                showToast('Не удалось скопировать');
            }
        }

        async function loadReviews(showLoader) {
            const loader = document.getElementById('loader');
            const list = document.getElementById('reviews-list');
            const empty = document.getElementById('empty-state');

            if (showLoader) {
                loader.style.display = 'flex';
                list.style.display = 'none';
                empty.style.display = 'none';
            }

            const { data, error } = await supabase
                .from('reviews')
                .select('*')
                .order('created_at', { ascending: false });

            loader.style.display = 'none';

            if (error) {
                empty.style.display = 'block';
                list.style.display = 'none';
                empty.querySelector('.empty-title').textContent = 'Ошибка загрузки';
                empty.querySelector('.empty-sub').textContent = 'Проверьте config.js и подключение';
                return;
            }

            allReviews = data || [];
            updateStats(allReviews);
            filterReviews(currentFilter);

            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                const review = allReviews.find(r => r.id === id);
                if (review) showDetail(review);
            }
        }

        /* Event bindings */
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => filterReviews(tab.dataset.filter));
            bindPress(tab);
        });

        document.getElementById('btn-back').addEventListener('click', showList);
        document.getElementById('btn-share').addEventListener('click', shareReview);
        document.getElementById('btn-copy').addEventListener('click', () => {
            if (currentReview) copyToClipboard(getShareUrl(currentReview.id));
        });
        document.getElementById('btn-refresh').addEventListener('click', () => {
            loadReviews(true);
            showToast('Обновляем...');
        });
        document.getElementById('btn-retry').addEventListener('click', () => loadReviews(true));

        ['btn-back','btn-share','btn-copy','btn-refresh','btn-retry'].forEach(id => bindPress(document.getElementById(id)));

        window.addEventListener('popstate', e => {
            if (e.state?.view === 'detail' && e.state.id) {
                const r = allReviews.find(x => x.id === e.state.id);
                if (r) showDetail(r);
            } else {
                document.getElementById('list-view').classList.remove('hidden');
                document.getElementById('detail-view').classList.remove('active');
                currentReview = null;
            }
        });

        loadReviews(true);
    </script>
</body>
</html>
